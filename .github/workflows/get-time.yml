name: Get Current Time

on:
  workflow_call:          
    outputs:
      current_time:
        description: "Current UTC time"
        value: ${{ jobs.get_time.outputs.current_time }}

jobs:
  get_time:
    runs-on: ubuntu-latest
    outputs:
      current_time: ${{ steps.time.outputs.time }}
    steps:
      - name: Print current time
        id: time
        run: |
          echo "---" >> $GITHUB_OUTPUT
          CURRENT_TIME=$(curl -s https://worldtime.timezone.io/api/timezone/Etc/UTC | sed -n 's/.*"datetime":"\([^"]*\)".*/\1/p')
          
          if [ -z "$CURRENT_TIME" ]; then
            echo "Failed to fetch the time"
            exit 1
          fi

          echo "Current UTC time: $CURRENT_TIME"
          echo "time=$CURRENT_TIME" >> $GITHUB_OUTPUT
          
          echo "### Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Current UTC time:** $CURRENT_TIME" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_OUTPUT
